<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-stt settings</title>
<style>
  :root {
    --bg: #1c1f24; --panel: #262a31; --panel2: #2d323b; --fg: #e8eaed;
    --muted: #9aa3af; --accent: #3ea65c; --accent2: #4a9eff; --danger: #e43a3a;
    --border: #3a404a; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 560px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row label.name { width: 130px; flex-shrink: 0; color: var(--muted); }
  .grow { flex: 1; }
  input[type=text], input[type=password] {
    background: var(--panel2); border: 1px solid var(--border); color: var(--fg);
    border-radius: 7px; padding: 8px 11px; font-size: 14px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--accent2); }
  .seg { display: inline-flex; background: var(--panel2); border-radius: 7px;
    border: 1px solid var(--border); overflow: hidden; }
  .seg button { background: none; border: none; color: var(--muted);
    padding: 7px 16px; cursor: pointer; font-size: 14px; }
  .seg button.active { background: var(--accent2); color: #fff; }
  .models { display: flex; flex-direction: column; gap: 2px; }
  .model { display: flex; align-items: center; gap: 12px; padding: 9px 10px;
    border-radius: 7px; cursor: pointer; }
  .model:hover { background: var(--panel2); }
  .model.sel { background: var(--panel2); }
  .model .radio { width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--muted); flex-shrink: 0; }
  .model.sel .radio { border-color: var(--accent2); background: radial-gradient(var(--accent2) 40%, transparent 45%); }
  .model .mname { flex: 1; font-variant-numeric: tabular-nums; }
  .model .size { color: var(--muted); font-size: 13px; width: 70px; text-align: right; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; }
  .tag.loaded { background: rgba(62,166,92,.2); color: var(--accent); }
  .tag.have { color: var(--muted); }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--fg);
    border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent2); }
  .btn.dl { color: var(--accent2); }
  .btn.rm { color: var(--danger); }
  .hk { font-family: ui-monospace, monospace; cursor: pointer; text-align: center; }
  .hk.capturing { border-color: var(--accent2); color: var(--accent2); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  footer { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .apply { background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .apply:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>local-stt settings</h1>
    <div class="status"><span class="dot" id="daemonDot"></span><span id="daemonText">…</span></div>
  </header>

  <section>
    <h2>Model</h2>
    <div class="models" id="models"></div>
  </section>

  <section>
    <h2>Dictation</h2>
    <div class="row">
      <label class="name">Hotkey</label>
      <input type="text" class="hk" id="hotkey" readonly value="…">
    </div>
    <div class="hint" id="hkHint">Click the field, then press your shortcut.</div>
    <div class="row" style="margin-top:12px">
      <label class="name">Mode</label>
      <div class="seg" id="mode">
        <button data-v="toggle">toggle</button><button data-v="hold">hold</button>
      </div>
    </div>
    <div class="row">
      <label class="name">Output</label>
      <div class="seg" id="output">
        <button data-v="type">type</button><button data-v="clipboard">clipboard</button>
      </div>
    </div>
    <div class="row">
      <label class="name">Language</label>
      <input type="text" class="grow" id="language" placeholder="en (blank = auto-detect)">
    </div>
  </section>

  <section>
    <h2>Meetings</h2>
    <div class="row">
      <label class="name">Folder</label>
      <input type="text" class="grow" id="output_dir">
    </div>
    <div class="row">
      <label class="name">HF token</label>
      <input type="password" class="grow" id="hf_token" placeholder="hf_… (for --diarize)">
    </div>
  </section>

  <footer>
    <button class="apply" id="apply">Apply</button>
    <span class="msg" id="msg"></span>
  </footer>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const api = (path, opts={}) => fetch(path, {
  ...opts, headers: { "X-Token": TOKEN, "Content-Type": "application/json" }
});
let state = null;
const draft = { model: {}, dictation: {}, meeting: {}, diarize: {} };

function setSeg(id, value) {
  document.querySelectorAll(`#${id} button`).forEach(b =>
    b.classList.toggle("active", b.dataset.v === value));
}

function renderModels() {
  const el = document.getElementById("models");
  const chosen = draft.model.name ?? state.config.model.name;
  el.innerHTML = "";
  for (const m of state.models) {
    const row = document.createElement("div");
    row.className = "model" + (m.name === chosen ? " sel" : "");
    const size = m.size_mb ? (m.size_mb >= 1000 ? (m.size_mb/1000).toFixed(1)+" GB" : m.size_mb+" MB") : "";
    const dl = state.downloading[m.name];
    let right;
    if (m.loaded) right = `<span class="tag loaded">loaded</span>`;
    else if (dl === "running") right = `<span class="tag have">downloading…</span>`;
    else if (dl && dl.startsWith("error")) right = `<span class="tag" style="color:var(--danger)">failed</span>`;
    else if (m.downloaded) right = `<button class="btn rm" data-rm="${m.name}">remove</button>`;
    else right = `<button class="btn dl" data-dl="${m.name}">download</button>`;
    row.innerHTML = `<span class="radio"></span><span class="mname">${m.name}</span>` +
                    `<span class="size">${size}</span>${right}`;
    row.querySelector(".radio").onclick = row.querySelector(".mname").onclick = () => {
      if (!m.downloaded) return flash("Download this model first.", true);
      draft.model.name = m.name; renderModels();
    };
    el.appendChild(row);
  }
  el.querySelectorAll("[data-dl]").forEach(b => b.onclick = async () => {
    await api("/api/models/download", {method:"POST", body: JSON.stringify({name:b.dataset.dl})});
    poll();
  });
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    await api("/api/models/remove", {method:"POST", body: JSON.stringify({name:b.dataset.rm})});
    load();
  });
}

function render() {
  const c = state.config;
  document.getElementById("daemonDot").classList.toggle("on", state.daemon_running);
  document.getElementById("daemonText").textContent = "daemon: " + (state.daemon_running ? "on" : "off");
  document.getElementById("hotkey").value = fmtHotkey(c.dictation.hotkey);
  document.getElementById("hotkey").dataset.raw = c.dictation.hotkey;
  setSeg("mode", c.dictation.mode);
  setSeg("output", c.dictation.output);
  document.getElementById("language").value = c.model.language;
  document.getElementById("output_dir").value = c.meeting.output_dir;
  document.getElementById("hf_token").value = c.diarize.hf_token;
  renderModels();
}

function fmtHotkey(raw) {
  return raw.replace(/[<>]/g, "").split("+").map(p =>
    p.length === 1 ? p.toUpperCase() : p[0].toUpperCase()+p.slice(1)).join("+");
}

document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b =>
  b.onclick = () => {
    const field = seg.id; // mode | output
    draft.dictation[field] = b.dataset.v; setSeg(seg.id, b.dataset.v);
  }));

// hotkey capture
const hkEl = document.getElementById("hotkey");
hkEl.onclick = () => { hkEl.classList.add("capturing"); hkEl.value = "press keys…"; };
hkEl.onkeydown = (e) => {
  if (!hkEl.classList.contains("capturing")) return;
  e.preventDefault();
  const mods = [];
  if (e.ctrlKey) mods.push("ctrl");
  if (e.altKey) mods.push("alt");
  if (e.shiftKey) mods.push("shift");
  if (e.metaKey) mods.push("super");
  const k = e.key;
  if (["Control","Alt","Shift","Meta"].includes(k)) return; // wait for trigger
  let trigger = k.length === 1 ? k.toLowerCase() : k.toLowerCase();
  const raw = mods.map(m => `<${m}>`).join("+") + (mods.length ? "+" : "") + trigger;
  hkEl.dataset.raw = raw; hkEl.value = fmtHotkey(raw);
  hkEl.classList.remove("capturing");
  draft.dictation.hotkey = raw;
};

function collect() {
  draft.model.language = document.getElementById("language").value.trim();
  draft.meeting.output_dir = document.getElementById("output_dir").value.trim();
  draft.diarize.hf_token = document.getElementById("hf_token").value.trim();
  if (hkEl.dataset.raw) draft.dictation.hotkey = hkEl.dataset.raw;
  return draft;
}

function flash(text, isErr) {
  const m = document.getElementById("msg");
  m.textContent = text; m.className = "msg " + (isErr ? "err" : "ok");
  if (!isErr) setTimeout(() => { m.textContent = ""; }, 3000);
}

document.getElementById("apply").onclick = async () => {
  const btn = document.getElementById("apply");
  btn.disabled = true;
  try {
    const r = await api("/api/config", {method:"POST", body: JSON.stringify(collect())});
    const data = await r.json();
    if (!r.ok) return flash(data.error || "save failed", true);
    flash(state.daemon_running ? "Applied — dictation reloaded." : "Saved.", false);
    await load();
  } catch (e) { flash(String(e), true); }
  finally { btn.disabled = false; }
};

async function load() {
  const r = await api("/api/state");
  state = await r.json();
  render();
}
async function poll() {  // refresh while a download runs
  await load();
  if (Object.values(state.downloading).some(s => s === "running")) setTimeout(poll, 1500);
}
load();
</script>
</body>
</html>
