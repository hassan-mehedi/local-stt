<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-stt settings</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); }
  footer { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  footer a { margin-left: auto; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>local-stt settings</h1>
    <div class="status"><span class="dot" id="daemonDot"></span><span id="daemonText">…</span></div>
  </header>

  <section>
    <h2>Model</h2>
    <div class="models" id="models"></div>
  </section>

  <section>
    <h2>Dictation</h2>
    <div class="row">
      <label class="name">Hotkey</label>
      <input type="text" class="hk" id="hotkey" readonly value="…">
    </div>
    <div class="hint" id="hkHint">Click the field, then press a shortcut. One modifier on its own, like Right Option, works too.</div>
    <div class="row" style="margin-top:12px">
      <label class="name">Mode</label>
      <div class="seg" id="mode">
        <button data-v="toggle">toggle</button><button data-v="hold">hold</button>
      </div>
    </div>
    <div class="row">
      <label class="name">Output</label>
      <div class="seg" id="output">
        <button data-v="type">type</button><button data-v="clipboard">clipboard</button>
      </div>
    </div>
    <div class="row">
      <label class="name">Language</label>
      <input type="text" class="grow" id="language" placeholder="en (blank = auto-detect)">
    </div>
  </section>

  <section>
    <h2>Meetings</h2>
    <div class="row">
      <label class="name">Folder</label>
      <input type="text" class="grow" id="output_dir">
    </div>
    <div class="row">
      <label class="name">HF token</label>
      <input type="password" class="grow" id="hf_token" placeholder="hf_… (for --diarize)">
    </div>
  </section>

  <footer>
    <button class="primary" id="apply">Apply</button>
    <span class="msg" id="msg"></span>
    <a id="setupLink" href="#">Run setup again</a>
  </footer>
</div>

<script src="/static/common.js"></script>
<script>
let state = null;
const draft = { model: {}, dictation: {}, meeting: {}, diarize: {} };

function drawModels() {
  renderModels(document.getElementById("models"), state, {
    chosen: draft.model.name ?? state.config.model.name,
    onChoose: m => { draft.model.name = m.name; drawModels(); },
    onChanged: poll,
    flash,
  });
}

function render() {
  const c = state.config;
  document.getElementById("daemonDot").classList.toggle("on", state.daemon_running);
  document.getElementById("daemonText").textContent = "daemon: " + (state.daemon_running ? "on" : "off");
  setHotkey(c.dictation.hotkey);
  setSeg("mode", c.dictation.mode);
  setSeg("output", c.dictation.output);
  document.getElementById("language").value = c.model.language;
  document.getElementById("output_dir").value = c.meeting.output_dir;
  document.getElementById("hf_token").value = c.diarize.hf_token;
  drawModels();
}

bindSeg("mode", v => { draft.dictation.mode = v; });
bindSeg("output", v => { draft.dictation.output = v; });
const setHotkey = hotkeyCapture(
  document.getElementById("hotkey"), document.getElementById("hkHint"),
  raw => { draft.dictation.hotkey = raw; },
);
document.getElementById("setupLink").href = "/onboarding?token=" + encodeURIComponent(TOKEN);

function collect() {
  draft.model.language = document.getElementById("language").value.trim();
  draft.meeting.output_dir = document.getElementById("output_dir").value.trim();
  draft.diarize.hf_token = document.getElementById("hf_token").value.trim();
  return draft;
}

function flash(text, isErr) {
  const m = document.getElementById("msg");
  m.textContent = text; m.className = "msg " + (isErr ? "err" : "ok");
  if (!isErr) setTimeout(() => { m.textContent = ""; }, 3000);
}

document.getElementById("apply").onclick = async () => {
  const btn = document.getElementById("apply");
  btn.disabled = true;
  try {
    const r = await post("/api/config", collect());
    const data = await r.json();
    if (!r.ok) return flash(data.error || "save failed", true);
    if (data.reload_error) flash("Saved, but dictation failed to restart: " + data.reload_error, true);
    else flash(data.daemon_running ? "Applied. Dictation reloaded." : "Saved.", false);
    await load();
  } catch (e) { flash(String(e), true); }
  finally { btn.disabled = false; }
};

async function load() {
  const r = await api("/api/state");
  state = await r.json();
  render();
}
async function poll() {  // refresh while a download runs
  await load();
  if (Object.values(state.downloading).some(s => s === "running")) setTimeout(poll, 1500);
}
load();
</script>
</body>
</html>
