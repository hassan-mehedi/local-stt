[project]
name = "local-stt"
version = "0.2.0"
description = "Local, offline dictation and transcription for the desktop"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soxr>=0.4",
    "pynput>=1.7.6",
    "pillow>=10",
    "tomlkit>=0.12",
    # Parakeet on the Apple Silicon GPU; the backend reuses its chunk-merge
    # helpers, so stay on 0.5.x
    "parakeet-mlx>=0.5.2,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # menu bar app, onboarding window, permission checks, start at login
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=11; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=11; sys_platform == 'darwin'",
    # the cleanup API key, in the Keychain or Secret Service
    "keyring>=25.7",
]
# Note: the tray uses the system PyGObject + Ayatana AppIndicator (GTK3),
# not a pip package; see ui.tray_gtk._load_gi(). On Mint these ship preinstalled
# (gir1.2-ayatanaappindicator3-0.1).

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]
diarize = [
    "pyannote.audio>=4.0",
]
# converts Whisper fine-tunes (e.g. bengali-whisper-medium) to CTranslate2
# on download; not needed at runtime
convert = [
    "transformers>=4.40",
    "torch>=2.2",
]
# Wayland hotkeys need evdev, which the override below excludes (it requires
# python3-dev to build). To enable: sudo apt install python3-dev, delete the
# override-dependencies line, then: uv sync --extra cuda --extra wayland
wayland = [
    "evdev>=1.6",
]

[project.scripts]
stt = "local_stt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_stt"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# app/ holds a whole Python install once packaging/macos/build.sh has run
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "BLE001", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# command line output, and the engine's port/token line for the app
"src/local_stt/cli.py" = ["T201"]
"src/local_stt/headless.py" = ["T201"]
"app/scripts/*" = ["T201"]
"packaging/*" = ["T201"]

[tool.uv]
# pynput declares evdev (its uinput backend) on Linux; it needs python3-dev
# to compile and we only use the X11 backend, so exclude it.
override-dependencies = ["evdev; sys_platform == 'never'"]
